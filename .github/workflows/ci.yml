name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npx tsc --noEmit
      - run: npm run check --prefix desktop
      - run: npm run lint
      - run: npm test
      - run: npm test --prefix desktop
      - run: npm audit --audit-level=high
      - run: npm audit --prefix desktop --audit-level=high
